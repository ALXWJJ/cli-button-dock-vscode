name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check and compile
        run: bun run compile
