name: Publish extension

on:
  workflow_dispatch:
    inputs:
      auth:
        description: Authentication method
        type: choice
        options:
          - pat
          - oidc
        default: pat
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to VS Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check and compile
        run: bun run compile

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF#refs/tags/}"
          tag_version="${tag#v}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Select publish auth method
        id: auth
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "method=${{ github.event.inputs.auth }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ vars.USE_OIDC_PUBLISH }}" = "true" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "method=pat" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with OIDC (no PAT)
        if: steps.auth.outputs.method == 'oidc'
        run: bun x @vscode/vsce publish --no-dependencies --oidc

      - name: Publish with PAT
        if: steps.auth.outputs.method == 'pat'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::VSCE_PAT secret is missing. Add it under Settings → Secrets, or set USE_OIDC_PUBLISH=true and configure OIDC on Marketplace."
            exit 1
          fi
          bun x @vscode/vsce publish --no-dependencies
